name: Reusable Terraform

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        dir: [terraform/platform, terraform/databricks]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.10.5"
      - name: Terraform fmt
        run: cd ${{ matrix.dir }} && terraform fmt --check
      - name: Terraform init
        run: cd ${{ matrix.dir }} && terraform init -backend=false
      - name: Terraform validate
        run: cd ${{ matrix.dir }} && terraform validate
      - name: Terraform test
        run: cd ${{ matrix.dir }} && terraform test
