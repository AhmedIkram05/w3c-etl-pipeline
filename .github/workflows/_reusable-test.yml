name: Reusable Test

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # DSN for tests/test_dim_geolocation_scd2_db.py — points at the postgres
      # service below (default user postgres, DB+password from POSTGRES_* there).
      W3C_TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # Spark 4.0 cannot start a JVM on Java 18+ (java.lang.UnsupportedOperation
      # Exception: getSubject is not supported). The runner default is newer, so
      # pin the JVM to the version the Spark container runs.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Create Airflow directory structure
        run: |
          sudo mkdir -p /opt/airflow/dags
          sudo ln -sf $PWD/pipeline/dags/w3c /opt/airflow/dags/w3c
          # spark/jobs needed by spark_ingestion.py at module load time
          sudo mkdir -p /opt/airflow/spark/jobs
          sudo ln -sf $PWD/pipeline/spark/jobs/utils /opt/airflow/spark/jobs/utils
          sudo mkdir -p /opt/airflow/plugins
          sudo ln -sf $PWD/pipeline/plugins/operators /opt/airflow/plugins/operators
      - name: Install dependencies
        run: |
          pip install -r tests/requirements-test.txt
      - name: Run tests with coverage
        # Run everything except integration tests (need Azure creds) and
        # dbt_compile tests (need dbt compile to have run first). The
        # dag_integrity tests now run in CI too — the previous local
        # namespace shadowing was removed when the local directory was
        # renamed to pipeline/, so no defensive marker exclusion is needed.
        run: pytest tests/ -v --tb=short -m "not integration and not dbt_compile" --cov=pipeline/spark/jobs --cov=pipeline/plugins --cov=pipeline/dags --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: pytest
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
