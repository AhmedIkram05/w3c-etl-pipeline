name: Reusable Lint

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .
      - name: Lockfile is current
        run: uv lock --check
      - name: MyPy type check (tests)
        run: mypy --ignore-missing-imports tests/
      - name: MyPy type check (Databricks scripts)
        run: mypy --ignore-missing-imports pipeline/spark/databricks/
      - name: MyPy type check (Spark jobs)
        run: mypy --ignore-missing-imports pipeline/spark/jobs/
      - name: MyPy type check (Airflow DAGs)
        run: mypy --ignore-missing-imports pipeline/dags/
      - name: Bandit security scan
        run: bandit -r pipeline/ -c pyproject.toml
      - name: SQLFluff dbt SQL lint
        run: sqlfluff lint pipeline/dbt/w3c/models/ --dialect postgres
