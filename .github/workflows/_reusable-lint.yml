name: Reusable Lint

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install ruff==0.17.3 mypy==1.14.0 types-requests types-python-dateutil bandit==1.9.4 sqlfluff==3.5.0
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check .
      - name: MyPy type check (tests)
        run: mypy --ignore-missing-imports tests/
      - name: MyPy type check (Databricks scripts)
        run: mypy --ignore-missing-imports pipeline/spark/databricks/
      - name: Bandit security scan
        run: bandit -r pipeline/ -c pyproject.toml
      - name: SQLFluff dbt SQL lint
        run: sqlfluff lint pipeline/dbt/w3c/models/ --dialect postgres
        continue-on-error: true
