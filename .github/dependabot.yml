# ---------------------------------------------------------------------------
# Dependabot — Unified Monday-Morning Dependency Updates
# ---------------------------------------------------------------------------
# - Weekly, Monday 09:00 Europe/London across every ecosystem
# - Minor/patch bumps grouped into one PR per ecosystem
# - Patch updates auto-merged via workflow; minor/major need human review
# ---------------------------------------------------------------------------

version: 2
updates:
  # Python dependencies (pyproject.toml + uv.lock at the repo root).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    target-branch: "main"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5
    reviewers:
      - "ahmedikram"
    commit-message:
      prefix: "chore"
    # This entry owns the ROOT uv project (pyproject.toml + uv.lock) and
    # tests/requirements-test.txt — nothing under pipeline/.
    # Dependabot's uv scanner also picks up requirements.txt files in
    # subdirectories, so without this it double-managed pipeline/requirements.txt
    # alongside the dedicated "pip" entry below — every pipeline dependency
    # produced two PRs (#203 + #204, #197 + #198, #185 + #188), and the second
    # one was always an empty merge once the first landed.
    exclude-paths:
      - "pipeline/**"
    # Mirror the /pipeline pip entry's protections on the entry that actually
    # scans these files — the root uv job kept proposing majors the pip entry
    # already blocks (apache-airflow 2→3, protobuf 5→7). The dbt stack is
    # exact-pinned to 1.8.x (see pipeline/requirements.txt comments) and is held
    # until the protobuf 5→6 migration is done deliberately.
    ignore:
      - dependency-name: "apache-airflow"
        update-types: ["version-update:semver-major"]
      - dependency-name: "apache-airflow-providers-openlineage"
        update-types: ["version-update:semver-major"]
      - dependency-name: "apache-airflow-providers-apache-spark"
        update-types: ["version-update:semver-major"]
      - dependency-name: "apache-airflow-providers-databricks"
        update-types: ["version-update:semver-major"]
      - dependency-name: "protobuf"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dbt-core"
      - dependency-name: "dbt-common"
      - dependency-name: "dbt-postgres"
      - dependency-name: "dbt-sqlserver"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # Python — Airflow stack (pipeline/requirements.txt).
  - package-ecosystem: "pip"
    directory: "/pipeline"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    target-branch: "main"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5
    reviewers:
      - "ahmedikram"
    commit-message:
      prefix: "chore"
    # Only auto-merge patch updates.
    allow:
      - dependency-type: "direct"
        update-types: ["version-update:semver-patch"]
    # Stack is on the Airflow 2.x line (base image apache/airflow:2.11.2):
    # never propose 3.x, and never propose majors that break the pinned
    # protobuf / sqlalchemy / pyodbc ranges (see pipeline/requirements.txt).
    ignore:
      - dependency-name: "apache-airflow"
        update-types: ["version-update:semver-major"]
      - dependency-name: "apache-airflow-providers-openlineage"
        update-types: ["version-update:semver-major"]
      - dependency-name: "apache-airflow-providers-apache-spark"
        update-types: ["version-update:semver-major"]
      - dependency-name: "apache-airflow-providers-databricks"
        update-types: ["version-update:semver-major"]
      - dependency-name: "protobuf"
        update-types: ["version-update:semver-major"]
      # dbt-fabric (via dbt-sqlserver 1.8.x) caps pyodbc<5.2.0.
      - dependency-name: "pyodbc"
        versions: [">=5.2"]
      # Airflow 2.11.2 (base image) and dbt-core 1.8.x cap sqlalchemy<2.0.
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major"]
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    target-branch: "main"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
    reviewers:
      - "ahmedikram"
    commit-message:
      prefix: "chore"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # Terraform providers
  - package-ecosystem: "terraform"
    directory: "/terraform/platform"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    target-branch: "main"
    labels:
      - "dependencies"
      - "terraform"
    open-pull-requests-limit: 5
    reviewers:
      - "ahmedikram"
    commit-message:
      prefix: "chore"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "terraform"
    directory: "/terraform/databricks"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    target-branch: "main"
    labels:
      - "dependencies"
      - "terraform"
    open-pull-requests-limit: 5
    reviewers:
      - "ahmedikram"
    commit-message:
      prefix: "chore"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # Docker images
  - package-ecosystem: "docker"
    directory: "/pipeline"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    target-branch: "main"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5
    reviewers:
      - "ahmedikram"
    commit-message:
      prefix: "chore"
    # Stack is pinned to apache/airflow 2.10.2: never propose the 3.x image.
    ignore:
      - dependency-name: "apache/airflow"
        update-types: ["version-update:semver-major"]
    groups:
      docker-all:
        patterns: ["*"]
