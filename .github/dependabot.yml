# ---------------------------------------------------------------------------
# Dependabot — Unified Monday-Morning Dependency Updates
# ---------------------------------------------------------------------------
# - Weekly, Monday 09:00 Europe/London across every ecosystem
# - Minor/patch bumps grouped into one PR per ecosystem
# - Patch updates auto-merged via workflow; minor/major need human review
# ---------------------------------------------------------------------------

version: 2
updates:
  # Python dependencies (pyproject.toml + uv.lock at the repo root).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    target-branch: "main"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5
    reviewers:
      - "ahmedikram"
    commit-message:
      prefix: "chore"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # Python — Airflow stack (pipeline/requirements.txt).
  - package-ecosystem: "pip"
    directory: "/pipeline"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    target-branch: "main"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5
    reviewers:
      - "ahmedikram"
    commit-message:
      prefix: "chore"
    # Only auto-merge patch updates.
    allow:
      - dependency-type: "direct"
        update-types: ["version-update:semver-patch"]
    # Stack is pinned to Airflow 2.x (2.10.2): never propose 3.x, and never
    # propose provider/protobuf majors that require Airflow >=2.11 / break
    # dbt-common (see pipeline/requirements.txt comments).
    ignore:
      - dependency-name: "apache-airflow"
        update-types: ["version-update:semver-major"]
      - dependency-name: "apache-airflow-providers-openlineage"
        update-types: ["version-update:semver-major"]
      - dependency-name: "apache-airflow-providers-apache-spark"
        update-types: ["version-update:semver-major"]
      - dependency-name: "apache-airflow-providers-databricks"
        update-types: ["version-update:semver-major"]
      - dependency-name: "protobuf"
        update-types: ["version-update:semver-major"]
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    target-branch: "main"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
    reviewers:
      - "ahmedikram"
    commit-message:
      prefix: "chore"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # Terraform providers
  - package-ecosystem: "terraform"
    directory: "/terraform/platform"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    target-branch: "main"
    labels:
      - "dependencies"
      - "terraform"
    open-pull-requests-limit: 5
    reviewers:
      - "ahmedikram"
    commit-message:
      prefix: "chore"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "terraform"
    directory: "/terraform/databricks"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    target-branch: "main"
    labels:
      - "dependencies"
      - "terraform"
    open-pull-requests-limit: 5
    reviewers:
      - "ahmedikram"
    commit-message:
      prefix: "chore"
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  # Docker images
  - package-ecosystem: "docker"
    directory: "/pipeline"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    target-branch: "main"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 5
    reviewers:
      - "ahmedikram"
    commit-message:
      prefix: "chore"
    # Stack is pinned to apache/airflow 2.10.2: never propose the 3.x image.
    ignore:
      - dependency-name: "apache/airflow"
        update-types: ["version-update:semver-major"]
    groups:
      docker-all:
        patterns: ["*"]
