# ---------------------------------------------------------------------------
# Dependabot — Automated Dependency Updates
# ---------------------------------------------------------------------------
# - Patch updates auto-merged via workflow
# - Minor/major create PRs for human review
# - Check daily for critical security patches
# ---------------------------------------------------------------------------

version: 2
updates:
  # Python dependencies (pip + uv)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 10
    reviewers:
      - "ahmedikram"
    # Only auto-merge patch updates
    allow:
      - dependency-type: "direct"
        update-types: ["version-update:semver-patch"]
    # Stack is pinned to Airflow 2.x (2.10.2): never propose 3.x, and never
    # propose provider/protobuf majors that require Airflow >=2.11 / break
    # dbt-common (see pipeline/requirements.txt comments).
    ignore:
      - dependency-name: "apache-airflow"
        update-types: ["version-update:semver-major"]
      - dependency-name: "apache-airflow-providers-openlineage"
        update-types: ["version-update:semver-major"]
      - dependency-name: "apache-airflow-providers-apache-spark"
        update-types: ["version-update:semver-major"]
      - dependency-name: "apache-airflow-providers-databricks"
        update-types: ["version-update:semver-major"]
      - dependency-name: "protobuf"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
    reviewers:
      - "ahmedikram"

  # Terraform providers
  - package-ecosystem: "terraform"
    directory: "/terraform/platform"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "terraform"
    open-pull-requests-limit: 5
    reviewers:
      - "ahmedikram"

  - package-ecosystem: "terraform"
    directory: "/terraform/databricks"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "terraform"
    open-pull-requests-limit: 5
    reviewers:
      - "ahmedikram"

  # Docker images
  - package-ecosystem: "docker"
    directory: "/pipeline"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    labels:
      - "dependencies"
      - "docker"
    open-pull-requests-limit: 3
    reviewers:
      - "ahmedikram"
    # Stack is pinned to apache/airflow 2.10.2: never propose the 3.x image.
    ignore:
      - dependency-name: "apache/airflow"
        update-types: ["version-update:semver-major"]
