[project]
name = "w3c-etl-pipeline"
version = "3.0.0"
description = "Spark → PostgreSQL → dbt pipeline for IIS W3C web log analytics"
requires-python = ">=3.12"
# Import-level runtime dependencies of the Python modules in this repo.
# Container/provisioning pins live in pipeline/requirements-dbt.txt,
# pipeline/requirements.txt and pipeline/spark/requirements_spark.txt.
dependencies = [
    "azure-storage-blob>=12.31.1",
    "geoip2==5.3.0",
    "maxminddb==3.2.0",
    "pandas==2.2.3",
    "prometheus-client>=0.26.0,<1.0",
    "psycopg2-binary>=2.9.13,<3.0",
    "pyarrow==19.0.1",
    "pymssql>=2.4.6,<3.0",
    "pyodbc>=5.3.0,<5.4",
    "requests==2.34.2",
    "user-agents==2.2.0",
]

[project.optional-dependencies]
# Airflow image: what the base apache/airflow:2.11.2 image does not already
# provide. Consumed by pipeline/requirements.txt.
airflow = [
    "apache-airflow-providers-openlineage>=2.20.3,<3",
    "openlineage-dbt>=1.55.0",
    "sqlalchemy>=1.4.36,<2.0",
]
# dbt stack. Consumed by pipeline/requirements.txt and the CI dbt-compile job.
dbt = [
    "dbt-core==1.11.17",
    "dbt-postgres==1.11.0",
    "dbt-sqlserver==1.11.3",
    "protobuf>=6.0,<7.0",
]
# Spark job containers (pipeline/spark/requirements_spark.txt).
spark = [
    "geoip2==5.3.0",
    "maxminddb==3.2.0",
    "pandas==2.2.3",
    "pyarrow==19.0.1",
    "user-agents==2.2.0",
]
# Test environment (tests/requirements-test.txt).
test = [
    "apache-airflow>=2.11.2,<3.0",
    "apache-airflow-providers-apache-spark>=6.3.4,<7.0",
    "apache-airflow-providers-databricks==4.6.0",
    "pyspark==4.0.2",
    "pyspark-client==4.0.2",
    "pytest>=9.2.0,<10.0",
    "pytest-cov>=7.1.0,<8.0",
]
# Local checks and CI lint job (requirements-dev.txt).
dev = [
    "bandit==1.9.4",
    "mypy==1.14.0",
    "ruff==0.17.3",
    "sqlfluff==3.5.0",
    "types-PyYAML==6.0.12.20261103",
    "types-python-dateutil==2.9.0.20261104",
    "types-requests==2.33.0.20261030",
    "uv==0.10.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.format]
preview = true

[tool.bandit]
exclude_dirs = ["tests", ".github"]
# B101 asserts are test-style guards, B311 flags non-cryptographic random
# (retry jitter and salt bucketing). Everything else is scanned and any
# remaining finding is annotated with its own justified nosec.
skips = ["B101", "B311"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_configs = false
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = false

[[tool.mypy.overrides]]
module = "spark.databricks.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
importmode = "importlib"
pythonpath = ["pipeline/spark/jobs", "pipeline/dags", "pipeline/plugins"]
consider_namespace_packages = false
markers = [
    "integration: marks tests that need Docker stack running (deselect with '-m \"not integration\"')",
    "dag_integrity: marks tests that need Airflow environment (deselect with '-m \"not dag_integrity\"')",
    "terraform: marks tests that need terraform binary on PATH (deselect with '-m \"not terraform\"')",
    "dbt_compile: marks tests that validate dbt compiled output (deselect with '-m \"not dbt_compile\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning:airflow.*",
    "ignore::DeprecationWarning:pyspark.*",
    'ignore::DeprecationWarning:google\._upb\._message.*',
]
addopts = "-v --tb=short"

[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
